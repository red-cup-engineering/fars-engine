name: FARS source and native Cell conformance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check native CLI and source admission syntax without registry dependencies
        run: |
          node --check scripts/flatfile-resource-graph.mjs
          node --check src/adapters/git-source-pins.mjs
          node --check src/adapters/git-ref-sources.mjs
          node --check src/adapters/pinned-sources.mjs
          node --check src/provider/exact-source-revision.mjs
          node --check src/provider/json-resource-lifecycle.mjs
          node --check test/json-resource-lifecycle.test.mjs
          node --check test/host-generated-source-boundary.test.mjs
          node --check test/repository-registry-routing.test.mjs
      - name: Test exact source identity and Git-tree selection
        run: node --test test/exact-source-revision.test.mjs test/git-source-pins.test.mjs test/git-ref-sources.test.mjs test/host-generated-source-boundary.test.mjs test/repository-registry-routing.test.mjs
  native-cell-receiving:
    needs: source-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_registry: https://registry.561.group/
      COREPACK_NPM_REGISTRY: https://registry.561.group/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Receive exact published supplier closure
        shell: bash
        run: |
          shared_store="${LAGOON_PNPM_STORE_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/pnpm/store}"
          mkdir -p "$shared_store"
          store_mode=$(stat -c '%a' "$shared_store")
          umask "$(printf '%03o' "$((0777 & ~0$store_mode))")"
          set -euo pipefail
          corepack pnpm@11.28.5 install \ --store-dir="$shared_store" --config.enable-global-virtual-store=true --config.package-import-method=hardlink --config.registry=https://registry.561.group/
            --frozen-lockfile --ignore-scripts
      - name: Run original complete Cell and lifecycle suite
        run: npm test
